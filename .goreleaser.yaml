# GoReleaser v2 configuration for the `dream` CLI.
#
# Archive naming contract (mirrored by npm/scripts/install.js — keep in sync):
#   dream_<version>_<goos>_<goarch>.tar.gz   (zip for windows)
#   e.g. dream_0.1.0_linux_amd64.tar.gz, dream_0.1.0_windows_arm64.zip
# <version> has no leading "v". The binary sits at the archive root as
# `dream` (`dream.exe` on windows). Checksums land in checksums.txt.
version: 2

project_name: dream

builds:
  - id: dream
    main: ./cmd/dream
    binary: dream
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.buildChannel=release
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  use: github-native

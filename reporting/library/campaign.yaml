version: v1alpha1
kind: ReportDefinition
name: campaign
description: Marketing spend, reach, and what it acquired.
categories: [delivery, performance]
modalities: [glance, delta]
stances: [strategic, operational]

scope:
  attach: [site, realm]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      spend_eur: sum
      impressions: sum
      conversions: sum
      ctr_pct: avg
      cac_eur: avg
      roas: avg
    timeline: merge
    pulse: sample(20)

data:
  kpis:
    - { name: spend_eur, unit: currency, window: 24h }
    - { name: impressions, unit: count, window: 24h }
    - { name: ctr_pct, unit: percent, window: 24h, direction: below }
    - { name: cac_eur, unit: currency, window: 24h, direction: above }
    - { name: roas, unit: ratio, window: 24h, direction: below }
    - { name: conversions, unit: count, window: 24h, direction: below }
  series:
    - { name: spend_rate, unit: per-hour }
    - { name: cac_trend, unit: currency }
  events:
    - { type: campaign.launched, severity: info }
    - { type: campaign.cac_breach, severity: warn }
    - { type: campaign.creative_rejected, severity: warn }
    - { type: campaign.paused, severity: critical }
  tables:
    - name: cac_bridge  # amounts in euro cents
      columns: [step, amount, kind]  # kind: total at the ends, delta between
    - name: acquisition_funnel
      columns: [stage, count]
    - name: spend_by_channel
      columns: [channel, spend_eur, conversions, cac_eur, roas]
    - name: spend_by_unit
      columns: [unit, spend_eur]

facets:
  summary:
    status: { from: roas, warn_at: 1.0, critical_at: 0.6, direction: below }
    kpis: [spend_eur, impressions, ctr_pct, cac_eur, roas, conversions]
    sparkline: spend_rate
    headline: "{{spend_eur}} EUR spent, {{conversions}} acquired at {{cac_eur}} EUR each"
  timeline:
    events: [campaign.launched, campaign.cac_breach, campaign.creative_rejected, campaign.paused]
    milestones: [campaign.launched]
  detail:
    panels:
      - { title: Spend rate, primitive: timeseries, data: series/spend_rate, section: overview }
      - { title: Cost per acquisition against target, primitive: kpi_card, data: kpi/cac_eur, section: performance }
      - { title: What moved CAC (euro cents), primitive: waterfall, data: table/cac_bridge, section: drivers }
      - { title: Impression to subscriber, primitive: funnel, data: table/acquisition_funnel, section: drivers }
      - { title: Spend by team, primitive: bar_ranked, data: table/spend_by_unit, section: drivers }
      - { title: Campaigns needing a decision, primitive: ticker, data: events, section: exceptions }
      - { title: Channel detail, primitive: datagrid, data: table/spend_by_channel, section: detail }
    drilldown: [subscriber-growth, brand-reach]
  pulse:
    events: [campaign.paused, campaign.cac_breach]
    rate_limit: 10/min
  media:
    archetypes: [anchor, recap]
  conversation:
    grounding: [kpis, series, tables]
    prompts:
      - "Why did cost per acquisition move yesterday?"
      - "Which channels should take budget from which?"
      - "How much of yesterday's spend was brand rather than performance?"

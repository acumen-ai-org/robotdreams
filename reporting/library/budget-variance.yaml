version: v1alpha1
kind: ReportDefinition
name: budget-variance
description: Plan, actual and forecast spend, with the variance attributed to its drivers.
categories: [cost, performance]
modalities: [delta, narrative, glance]
stances: [strategic]

scope:
  attach: [site, realm, world]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      plan_eur: sum
      actual_eur: sum
      forecast_eur: sum
      variance_pct: avg
      forecast_accuracy_pct: avg
    timeline: merge
    pulse: sample(10)

data:
  kpis:
    - { name: plan_eur, unit: eur, window: 30d }
    - { name: actual_eur, unit: eur, window: 30d }
    - { name: forecast_eur, unit: eur, window: 30d }
    - { name: variance_pct, unit: percent, target: 5, direction: above }  # signed; negative is underspend
    - { name: forecast_accuracy_pct, unit: percent, window: 90d, target: 95, direction: below }
  series:
    - { name: burn_rate, unit: eur-per-day }
  events:
    - { type: forecast.revised, severity: info }
    - { type: variance.explained, severity: info }
    - { type: budget.reallocated, severity: info }
    - { type: budget.overrun, severity: warn }
    - { type: budget.breached, severity: critical }
  tables:
    - name: variance_bridge
      columns: [step, amount, kind]  # kind: total at the ends, delta between
    - name: variance_by_cost_centre
      columns: [cost_centre, variance_eur]
    - name: overruns
      columns: [account, owner, plan_eur, actual_eur, overrun_eur]
    - name: line_items
      columns: [account, plan_eur, actual_eur, variance_eur, variance_pct, owner]
    - name: actual_by_unit
      columns: [unit, actual_eur]

facets:
  summary:
    status: { from: variance_pct, warn_at: 5, critical_at: 12, direction: above }
    kpis: [plan_eur, actual_eur, forecast_eur, variance_pct]
    sparkline: burn_rate
    headline: "{{actual_eur}} EUR actual against {{plan_eur}} plan, {{variance_pct}}% variance"
  timeline:
    events: [forecast.revised, variance.explained, budget.reallocated, budget.overrun, budget.breached]
    milestones: [forecast.revised, budget.breached]
  detail:
    panels:
      - { title: Burn rate, primitive: timeseries, data: series/burn_rate, section: overview }
      - { title: Forecast accuracy against target, primitive: kpi_card, data: kpi/forecast_accuracy_pct, section: performance }
      - { title: Plan to actual, primitive: waterfall, data: table/variance_bridge, section: drivers }
      - { title: Variance by cost centre, primitive: bar_ranked, data: table/variance_by_cost_centre, section: drivers }
      - { title: Actual by unit, primitive: bar_ranked, data: table/actual_by_unit, section: drivers }
      - { title: Lines over plan, primitive: datagrid, data: table/overruns, section: exceptions, stance: strategic }
      - { title: Plan against actual by account, primitive: datagrid, data: table/line_items, section: detail }
    drilldown: [cost, financial-close, portfolio]
  pulse:
    events: [budget.overrun, budget.breached]
    rate_limit: 5/min
  media:
    archetypes: [anchor, recap]
  conversation:
    grounding: [kpis, series, tables]
    prompts:
      - "Why are we over plan this month?"
      - "Which cost centre drove the variance?"
      - "How accurate has the forecast been over the last quarter?"

version: v1alpha1
kind: ReportDefinition
name: ml-experiment
description: Experiments running, what concluded, what shipped, and what breached a guardrail.
categories: [quality, roadmap]
modalities: [narrative, delta, glance]
stances: [diagnostic, strategic]

scope:
  attach: [site, realm]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      experiments_running: sum
      experiments_shipped: sum
      guardrail_breaches: sum
      exposure_pct: avg
      conclusive_pct: avg
      best_lift_pct: max
    timeline: merge
    pulse: sample(20)

data:
  kpis:
    - { name: experiments_running, unit: count }
    - { name: exposure_pct, unit: percent }
    - { name: conclusive_pct, unit: percent }
    - { name: best_lift_pct, unit: percent }
    - { name: experiments_shipped, unit: count, window: 30d }
    - { name: guardrail_breaches, unit: count, window: 30d, target: 0, direction: above }
  series:
    - { name: exposure_trend, unit: percent }
  events:
    - { type: experiment.started, severity: info }
    - { type: experiment.concluded, severity: info }
    - { type: experiment.shipped, severity: info }
    - { type: experiment.stopped, severity: warn }
    - { type: guardrail.breached, severity: critical }
  tables:
    - name: experiment_stages
      columns: [stage, count]
    - name: experiments
      columns: [experiment, primary_metric, lift_pct, significance, decision]
    - name: guardrails
      columns: [experiment, guardrail, movement, action]
    - name: experiments_by_unit
      columns: [unit, experiments_running]

facets:
  summary:
    status: { from: guardrail_breaches, warn_at: 1, critical_at: 3, direction: above }
    kpis: [experiments_running, exposure_pct, conclusive_pct, experiments_shipped]
    sparkline: exposure_trend
    headline: "{{experiments_running}} running at {{exposure_pct}}% exposure, {{experiments_shipped}} shipped"
  timeline:
    events: [experiment.started, experiment.concluded, experiment.shipped, experiment.stopped, guardrail.breached]
    spans:
      - { name: experiment, start: experiment.started, end: experiment.concluded }
    milestones: [experiment.shipped, guardrail.breached]
  detail:
    panels:
      - { title: Traffic under test, primitive: timeseries, data: series/exposure_trend, section: overview }
      - { title: Exposed to shipped, primitive: funnel, data: table/experiment_stages, section: drivers }
      - { title: Tests running by unit, primitive: bar_ranked, data: table/experiments_by_unit, section: drivers }
      - { title: Guardrail breaches, primitive: datagrid, data: table/guardrails, section: exceptions }
      - { title: Every experiment, primitive: datagrid, data: table/experiments, section: detail }
    drilldown: [quality, data-pipeline]
  pulse:
    events: [experiment.shipped, experiment.stopped, guardrail.breached]
    rate_limit: 20/min
  media:
    archetypes: [anchor, recap]
  conversation:
    grounding: [kpis, series, events, tables]
    prompts:
      - "Which experiments actually reached significance this month?"
      - "Has anything shipped that hurt a guardrail metric?"

# Report template: compliance — privacy and regulatory obligation.
# Categorised as failures (a failed control and a missed statutory
# deadline are faults, not opinions) and quality (whether the work was
# done right, evidenced rather than asserted). Deliberately separate
# from legal-matters: counsel measures throughput, compliance measures
# obligation, and the two have different deadlines and different
# regulators.
#
# Register with:
#   dream server --reports reporting/library/

version: v1alpha1
kind: ReportDefinition
name: compliance
description: DSARs, control testing, audit findings, and regulatory deadlines.
categories: [failures, quality]
modalities: [glance, delta]
stances: [operational, diagnostic]

scope:
  attach: [site, realm]
  aggregation:
    status: worst
    headline: synthesize
    # Backlogs, counts of tested controls, open findings and upcoming
    # deadlines are all workloads: they sum. The two percentages are
    # attainment rates against a population and average.
    kpis:
      dsar_backlog: sum
      controls_tested: sum
      audit_findings_open: sum
      deadlines_due_30d: sum
      dsar_sla_pct: avg
      controls_passed_pct: avg
    timeline: merge
    pulse: sample(20)

data:
  kpis:
    - { name: dsar_backlog, unit: count, window: 7d }
    # A subject access request has a statutory one-month deadline,
    # extendable to three for complex requests. The target is therefore
    # 100 and nothing else; the interesting question is how far below
    # it the team actually runs, which in practice is 94-99.
    - { name: dsar_sla_pct, unit: percent, window: 30d, target: 100, direction: below }
    - { name: controls_tested, unit: count, window: 30d }
    - { name: controls_passed_pct, unit: percent, window: 30d, target: 95, direction: below }
    - { name: audit_findings_open, unit: count, window: 7d }
    - { name: deadlines_due_30d, unit: count, window: 30d }
  series:
    - { name: dsar_backlog_trend, unit: count }
    - { name: control_pass_trend, unit: percent }
  events:
    - { type: dsar.received, severity: info }
    - { type: dsar.closed, severity: info }
    - { type: control.failed, severity: warn }
    - { type: finding.raised, severity: warn }
    - { type: deadline.approaching, severity: warn }
    - { type: breach.reportable, severity: critical }
  tables:
    # Regulation x status. Colour encodes how bad the cell is, never
    # which regulation it belongs to — the whole point of the grid is
    # that a reader's eye lands on the overdue column without being
    # told where to look.
    - name: regulation_status
      columns: [row, column, value]
    # Received -> identity verified -> data gathered -> responded ->
    # closed. Where a DSAR stalls is almost always identity, and a
    # backlog number alone never says that.
    - name: dsar_stages
      columns: [stage, count]
    - name: findings_open
      columns: [raised, regulation, finding, severity, owner, due]
    - name: control_tests
      columns: [tested, control, regulation, owner, outcome]
    - name: controls_by_unit
      columns: [unit, controls_passed_pct]

facets:
  summary:
    status: { from: dsar_sla_pct, warn_at: 98, critical_at: 94, direction: below }
    kpis: [dsar_backlog, dsar_sla_pct, audit_findings_open, deadlines_due_30d]
    sparkline: dsar_backlog_trend
    headline: "{{dsar_backlog}} DSARs open, {{dsar_sla_pct}}% inside the statutory deadline"
  timeline:
    events: [dsar.received, dsar.closed, control.failed, finding.raised, deadline.approaching, breach.reportable]
    spans:
      - { name: dsar, start: dsar.received, end: dsar.closed }
    milestones: [breach.reportable]
  detail:
    panels:
      - { title: DSAR backlog, primitive: timeseries, data: series/dsar_backlog_trend, section: overview }
      - { title: Statutory SLA attainment, primitive: kpi_card, data: kpi/dsar_sla_pct, section: performance }
      - { title: Where DSARs stall, primitive: funnel, data: table/dsar_stages, section: drivers }
      - { title: Control pass rate by unit, primitive: bar_ranked, data: table/controls_by_unit, section: drivers }
      - { title: Obligations by regulation, primitive: heatmap, data: table/regulation_status, section: exceptions }
      - { title: Open findings, primitive: datagrid, data: table/findings_open, section: exceptions }
      - { title: Control test results, primitive: datagrid, data: table/control_tests, section: detail }
    drilldown: [legal-matters, security-posture, decisions]
  pulse:
    events: [control.failed, breach.reportable, deadline.approaching]
    rate_limit: 10/min
  media:
    archetypes: [anchor]
  conversation:
    grounding: [kpis, series, tables]
    prompts:
      - "Which regulations have overdue obligations?"
      - "Are we answering subject access requests inside the deadline?"

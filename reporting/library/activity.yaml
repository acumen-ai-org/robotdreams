version: v1alpha1
kind: ReportDefinition
name: activity
description: Current activity — live task and node events at any scope.
categories: [activity]
modalities: [glance, storyboard]
stances: [operational, diagnostic]

scope:
  attach: [site, realm, world, universe]
  aggregation:
    status: worst
    headline: latest
    kpis:
      active_nodes: sum
      tasks_in_flight: sum
      tasks_finished: sum
      tokens_in: sum
      tokens_out: sum
      cost_usd: sum
    timeline: merge
    pulse: sample(80)
    time:
      kpis:
        tasks_finished: sum
        tokens_in: sum
        tokens_out: sum
        cost_usd: sum

data:
  kpis:
    - { name: active_nodes, unit: count }
    - { name: tasks_in_flight, unit: count }
    - { name: tasks_finished, unit: count, window: 1h }
    - { name: tokens_in, unit: count, window: 1h }
    - { name: tokens_out, unit: count, window: 1h }
    - { name: cost_usd, unit: count, window: 1h, direction: above }
  events:
    - { type: task.started, severity: info }
    - { type: task.finished, severity: info }
    - { type: task.blocked, severity: warn }
    - { type: node.connected, severity: info }
    - { type: node.disconnected, severity: warn }

facets:
  summary:
    status: { from: tasks_in_flight, warn_at: 50, critical_at: 200, direction: above }
    kpis: [active_nodes, tasks_in_flight, tasks_finished]
    headline: "{{active_nodes}} nodes active, {{tasks_in_flight}} tasks in flight"
  timeline:
    events: [task.started, task.finished, task.blocked, node.connected, node.disconnected]
    spans:
      - { name: task, start: task.started, end: task.finished }
  detail:
    panels:
      - { title: Live activity, primitive: ticker, data: events, section: overview }
      - { title: Task windows, primitive: gantt, data: spans/task, section: detail }
      - { title: Spend, primitive: kpi_card, data: kpi/cost_usd, section: drivers }
  pulse:
    events: [task.started, task.finished, task.blocked, node.connected, node.disconnected]
    rate_limit: 120/min

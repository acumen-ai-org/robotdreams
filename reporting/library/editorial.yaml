# Report definition: editorial — playlist programming. Genuinely
# creative work on a hard weekly rhythm: the Friday release day does not
# move, so the week ramps into Thursday, empties on Friday morning, and
# starts again. Produced by the editorial teams that program and refresh
# playlists, not by anyone who runs software.
#
# The numbers a programming lead cares about are how many slots got
# filled, how many pitches were worth taking, and how much listening
# the desk is actually responsible for. Impressions and CTR belong to
# marketing; they are deliberately not here.
#
# Register with:
#   dream server --reports reporting/library/

version: v1alpha1
kind: ReportDefinition
name: editorial
description: Playlist programming — slots filled, pitches taken, and what got added.
categories: [delivery, activity]
modalities: [glance, narrative, delta]
stances: [operational, strategic]

scope:
  attach: [site, realm]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      playlists_refreshed: sum
      pitches_reviewed: sum
      pitches_accepted: sum
      first_listen_adds: sum
      # Fill rate and editorial share are rates: they average. Two
      # desks at 98% filled are not a desk at 196%.
      slots_filled_pct: avg
      editorial_share_pct: avg
    timeline: merge
    pulse: sample(30)

data:
  kpis:
    - { name: playlists_refreshed, unit: count, window: 24h }
    # An empty slot on a flagship playlist on a Friday morning is the
    # one failure this desk does not accept, so the target is total.
    - { name: slots_filled_pct, unit: percent, target: 100, direction: below }
    - { name: pitches_reviewed, unit: count, window: 24h }
    - { name: pitches_accepted, unit: count, window: 24h }
    - { name: first_listen_adds, unit: count, window: 24h }
    # The share of listening that comes through editorial programming.
    # No target: it is a measure of influence, not a commitment.
    - { name: editorial_share_pct, unit: percent }
  series:
    - { name: pitch_volume, unit: count }
  events:
    - { type: playlist.refreshed, severity: info }
    - { type: pitch.accepted, severity: info }
    - { type: pitch.rejected, severity: info }
    - { type: slot.unfilled, severity: warn }
    - { type: release.late, severity: warn }
  tables:
    # Pitched narrows to programmed and then to charted. The drop from
    # pitched to shortlisted is the desk's taste; the drop from
    # programmed to charted is the audience's.
    - name: pitch_stages
      columns: [stage, count]
    - name: adds_by_playlist
      columns: [playlist, first_listen_adds]
    # What still has a hole in it, and what is holding it up.
    - name: open_slots
      columns: [playlist, slot_date, genre, blocker]
    - name: recent_programming
      columns: [when, playlist, track, artist, source]
    - name: playlists_by_unit
      columns: [unit, playlists_refreshed]

facets:
  summary:
    status: { from: slots_filled_pct, warn_at: 96, critical_at: 88, direction: below }
    kpis: [playlists_refreshed, slots_filled_pct, pitches_reviewed, first_listen_adds]
    sparkline: pitch_volume
    headline: "{{playlists_refreshed}} playlists refreshed, {{pitches_accepted}} of {{pitches_reviewed}} pitches taken"
  timeline:
    events: [playlist.refreshed, pitch.accepted, pitch.rejected, slot.unfilled, release.late]
    milestones: [slot.unfilled]
  detail:
    panels:
      - { title: Pitches reviewed, primitive: timeseries, data: series/pitch_volume, section: overview }
      - { title: Pitched to charted, primitive: funnel, data: table/pitch_stages, section: drivers }
      - { title: Adds by playlist, primitive: bar_ranked, data: table/adds_by_playlist, section: drivers }
      - { title: Refreshes by unit, primitive: bar_ranked, data: table/playlists_by_unit, section: drivers }
      - { title: Slots still open, primitive: datagrid, data: table/open_slots, section: exceptions }
      - { title: What went in, primitive: datagrid, data: table/recent_programming, section: detail }
    drilldown: [catalog, activity]
  pulse:
    events: [pitch.accepted, slot.unfilled, release.late]
    rate_limit: 30/min
  media:
    archetypes: [anchor, recap]
  conversation:
    grounding: [kpis, series, events, tables]
    prompts:
      - "Which playlists still have unfilled slots for Friday?"
      - "How many of this week's adds came from pitches rather than from us?"

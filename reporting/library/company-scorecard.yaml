version: v1alpha1
kind: ReportDefinition
name: company-scorecard
description: Users, subscribers, revenue, margin and headcount for the company as a whole.
categories: [performance, cost]
modalities: [glance, narrative, delta]
stances: [strategic]

scope:
  attach: [universe, world]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      mau: max
      premium_subs: max
      arpu_eur: avg
      gross_margin_pct: avg
      revenue_eur: sum
      opex_eur: sum
      headcount: sum
    timeline: merge
    pulse: sample(10)

data:
  kpis:
    - { name: mau, unit: count, window: 30d }
    - { name: premium_subs, unit: count, window: 30d, target: 276000000, direction: below }
    - { name: arpu_eur, unit: eur, window: 30d }
    - { name: gross_margin_pct, unit: percent, window: 30d, target: 31.5, direction: below }
    - { name: revenue_eur, unit: eur, window: 30d }
    - { name: opex_eur, unit: eur, window: 30d }
    - { name: headcount, unit: count }
  series:
    - { name: mau_trend, unit: count }
    - { name: revenue_trend, unit: eur }
  events:
    - { type: scorecard.published, severity: info }
    - { type: target.met, severity: info }
    - { type: target.missed, severity: warn }
    - { type: guidance.revised, severity: warn }
  tables:
    - name: revenue_bridge
      columns: [step, amount, kind]  # kind: total at the ends, delta between
    - name: revenue_by_division
      columns: [unit, revenue_eur]
    - name: off_track
      columns: [metric, owner, actual, target, gap]
    - name: scorecard
      columns: [metric, actual, target, variance, trend]

facets:
  summary:
    status: { from: gross_margin_pct, warn_at: 30, critical_at: 27, direction: below }
    kpis: [mau, premium_subs, revenue_eur, gross_margin_pct]
    sparkline: revenue_trend
    headline: "{{mau}} MAU and {{premium_subs}} Premium at {{arpu_eur}} ARPU, {{gross_margin_pct}}% gross margin"
  timeline:
    events: [scorecard.published, target.met, target.missed, guidance.revised]
    milestones: [scorecard.published, guidance.revised]
  detail:
    panels:
      - { title: Revenue, primitive: timeseries, data: series/revenue_trend, section: overview }
      - { title: Monthly active users, primitive: timeseries, data: series/mau_trend, section: overview }
      - { title: Gross margin against target, primitive: kpi_card, data: kpi/gross_margin_pct, section: performance }
      - { title: What moved revenue, primitive: waterfall, data: table/revenue_bridge, section: drivers }
      - { title: Revenue by division, primitive: bar_ranked, data: table/revenue_by_division, section: drivers }
      - { title: Metrics behind target, primitive: datagrid, data: table/off_track, section: exceptions, stance: strategic }
      - { title: The scorecard, primitive: datagrid, data: table/scorecard, section: detail }
    drilldown: [portfolio, budget-variance, subscriber-growth]
  pulse:
    events: [target.missed, guidance.revised]
    rate_limit: 5/min
  media:
    archetypes: [anchor, podcast, recap]
  conversation:
    grounding: [kpis, series, tables]
    prompts:
      - "How did the company do this month?"
      - "What moved revenue against last month?"
      - "Which divisions carry the top line?"

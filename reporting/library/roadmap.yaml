# Report template: roadmap — planned work, milestones, schedule drift.
# Timeline-centric. Copy, rename, and adapt.
#
# Register with:
#   dream server --reports reporting/library/

version: v1alpha1
kind: ReportDefinition
name: roadmap
description: Milestones, targets, and slippage against plan.
categories: [roadmap]
modalities: [narrative, delta, spatial, board]
stances: [strategic]

scope:
  attach: [realm, world]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      milestones_hit: sum
      milestones_missed: sum
      slip_days: max
    timeline: merge
    pulse: sample(10)
    # A department sees its cards; a division sees the busiest columns.
    items: sample(25)

data:
  kpis:
    - { name: milestones_hit, unit: count, window: 30d }
    - { name: milestones_missed, unit: count, window: 30d, target: 0, direction: above }
    # Plans slip; a plan that claims it will not is not a plan. The
    # commitment is to keep the slip inside a sprint.
    - { name: slip_days, unit: days, target: 5, direction: above }
  events:
    - { type: milestone.reached, severity: info }
    - { type: milestone.missed, severity: warn }
    - { type: plan.rescheduled, severity: warn }
    - { type: phase.started, severity: info }
    - { type: phase.finished, severity: info }
  tables:
    - name: upcoming
      columns: [due, milestone, owner, confidence]

facets:
  summary:
    status: { from: slip_days, warn_at: 3, critical_at: 14, direction: above }
    kpis: [milestones_hit, milestones_missed, slip_days]
    headline: "{{milestones_hit}} hit, {{milestones_missed}} missed, worst slip {{slip_days}}d"
  timeline:
    events: [milestone.reached, milestone.missed, plan.rescheduled, phase.started, phase.finished]
    spans:
      - { name: phase, start: phase.started, end: phase.finished }
    milestones: [milestone.reached, milestone.missed]
  detail:
    panels:
      - { title: Phases, primitive: gantt, data: spans/phase, section: overview }
      - { title: Schedule drift, primitive: kpi_card, data: kpi/slip_days, section: performance }
      - { title: Missed milestones, primitive: ticker, data: events, section: exceptions, stance: strategic }
      - { title: Upcoming milestones, primitive: datagrid, data: table/upcoming, section: detail }
      - { title: What is next, primitive: roadmap_lanes, data: items, section: next }
    drilldown: [delivery]
  # The `upcoming` table was a plan all along — due dates, owners and
  # confidence, rendered as opaque cells. Declaring it as a plan is not new
  # data; it is the same rows finally saying what they are.
  plan:
    # The shared flow vocabulary. Risk is not a column — a milestone at
    # risk is in progress with a due date it is going to miss, and the
    # due date is what says so.
    states: [proposed, committed, in_progress, done]
    horizons: [now, next, later]
    commitments: [committed, planned, candidate]
    levels: [workstream, activity]
    size_unit: days
    baseline: { name: Schedule commitment, ref: kpi/slip_days }
  pulse:
    events: [milestone.reached, milestone.missed, plan.rescheduled]
  media:
    archetypes: [anchor]
  conversation:
    grounding: [kpis, events, tables]
    prompts:
      - "Are we on track for the next milestone?"

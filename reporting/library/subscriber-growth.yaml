version: v1alpha1
kind: ReportDefinition
name: subscriber-growth
description: Users, subscribers, and the movements between them.
categories: [performance]
modalities: [glance, delta, narrative]
stances: [strategic]

scope:
  attach: [site, realm, world]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      mau: sum
      premium_subs: sum
      net_adds: sum
      churn_pct: avg
      arpu_eur: avg
      free_to_paid_pct: avg
    timeline: merge
    pulse: sample(20)

data:
  kpis:
    - { name: mau, unit: count, window: 7d }
    - { name: premium_subs, unit: count, window: 7d }
    - { name: net_adds, unit: count, window: 7d, direction: below }
    - { name: churn_pct, unit: percent, window: 30d, target: 4.0, direction: above }
    - { name: arpu_eur, unit: currency, window: 30d, direction: below }
    - { name: free_to_paid_pct, unit: percent, window: 7d, target: 55, direction: below }
  series:
    - { name: mau_trend, unit: count }
    - { name: net_adds_rate, unit: per-day }
  events:
    - { type: growth.milestone, severity: info }
    - { type: growth.target_missed, severity: warn }
    - { type: growth.churn_spike, severity: critical }
  tables:
    - name: subscriber_bridge
      columns: [step, amount, kind]  # kind: total at the ends, delta between
    - name: growth_funnel
      columns: [stage, count]
    - name: plan_mix
      columns: [plan, subscribers, arpu_eur, churn_pct]
    - name: premium_by_unit
      columns: [unit, premium_subs]

facets:
  summary:
    status: { from: churn_pct, warn_at: 4.5, critical_at: 6.0, direction: above }
    kpis: [mau, premium_subs, net_adds, churn_pct, arpu_eur]
    sparkline: net_adds_rate
    headline: "{{premium_subs}} premium of {{mau}} monthly actives, {{net_adds}} net this week"
  timeline:
    events: [growth.milestone, growth.target_missed, growth.churn_spike]
    milestones: [growth.milestone]
  detail:
    panels:
      - { title: Monthly actives, primitive: timeseries, data: series/mau_trend, section: overview }
      - { title: Net adds against plan, primitive: kpi_card, data: kpi/net_adds, section: performance }
      - { title: Subscriber bridge, primitive: waterfall, data: table/subscriber_bridge, section: drivers }
      - { title: Free to retained, primitive: funnel, data: table/growth_funnel, section: drivers }
      - { title: Premium subscribers by market, primitive: bar_ranked, data: table/premium_by_unit, section: drivers }
      - { title: Growth alerts, primitive: ticker, data: events, section: exceptions }
      - { title: Plan mix, primitive: datagrid, data: table/plan_mix, section: detail }
    drilldown: [campaign, support-queue]
  pulse:
    events: [growth.churn_spike]
    rate_limit: 6/min
  media:
    archetypes: [anchor, recap]
  conversation:
    grounding: [kpis, series, tables]
    prompts:
      - "What moved premium subscribers this week?"
      - "Which markets are losing subscribers to involuntary churn?"
      - "Is blended ARPU falling because of price or because of plan mix?"

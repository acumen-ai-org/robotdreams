# Report definition: data-pipeline — whether the data platform's
# tables are there, on time, and correct. Hourly, because that is the
# cadence the pipelines themselves run at.
#
# Deliberately NOT a second performance report: the data teams already
# produce `performance` and `incident` from the engineering builders,
# and repeating p95 latency or error rate here would say the same thing
# twice in different words. This report is about freshness, SLAs and
# data quality — the three things nobody else measures and the only
# things anyone asks a data team at 09:00.
#
# Register with:
#   dream server --reports reporting/library/

version: v1alpha1
kind: ReportDefinition
name: data-pipeline
description: Job runs, freshness against SLA, and data quality across the warehouse.
categories: [performance, failures]
modalities: [glance, delta]
stances: [operational, diagnostic]

scope:
  attach: [site, realm, world]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      jobs_run: sum
      jobs_failed: sum
      rows_processed: sum
      # Lateness takes the worst, not the mean: a warehouse where one
      # table is four hours stale and forty are fresh is a warehouse
      # with a four-hour problem, and averaging hides exactly that.
      freshness_lag_minutes: max
      sla_hit_pct: avg
      dq_pass_pct: avg
    timeline: merge
    pulse: sample(30)

data:
  kpis:
    - { name: jobs_run, unit: count, window: 1h }
    - { name: jobs_failed, unit: count, window: 1h }
    # An hour is the standard freshness promise for the hourly marts;
    # past it, the morning dashboards are reading yesterday.
    - { name: freshness_lag_minutes, unit: minutes, target: 60, direction: above }
    # 99% of runs inside their SLA window is the platform's published
    # commitment to its consumers.
    - { name: sla_hit_pct, unit: percent, target: 99, direction: below }
    - { name: rows_processed, unit: count, window: 1h }
    - { name: dq_pass_pct, unit: percent, target: 99, direction: below }
  series:
    - { name: freshness_lag, unit: minutes }
  events:
    - { type: job.failed, severity: warn }
    - { type: freshness.breached, severity: warn }
    - { type: sla.missed, severity: critical }
    - { type: backfill.started, severity: info }
    - { type: backfill.finished, severity: info }
  tables:
    # The money panel: which table is late, longest first. This is the
    # only question a data team is ever asked in the morning, so it is
    # answered as a ranking rather than as a search.
    - name: lateness_by_dataset
      columns: [dataset, lag_minutes]
    - name: late_datasets
      columns: [dataset, owner, lag_minutes, sla_minutes, status]
    - name: lag_by_unit
      columns: [unit, freshness_lag_minutes]

facets:
  summary:
    status: { from: sla_hit_pct, warn_at: 99, critical_at: 95, direction: below }
    kpis: [jobs_run, jobs_failed, freshness_lag_minutes, sla_hit_pct]
    sparkline: freshness_lag
    headline: "{{jobs_run}} jobs, {{jobs_failed}} failed, worst lag {{freshness_lag_minutes}}m"
  timeline:
    events: [job.failed, freshness.breached, sla.missed, backfill.started, backfill.finished]
    # A backfill is a period the warehouse is knowingly inconsistent
    # in, which is why it belongs on the timeline as a bar.
    spans:
      - { name: backfill, start: backfill.started, end: backfill.finished }
    milestones: [sla.missed]
  detail:
    panels:
      - { title: Freshness lag, primitive: timeseries, data: series/freshness_lag, section: overview }
      - { title: Which table is late, primitive: bar_ranked, data: table/lateness_by_dataset, section: drivers }
      - { title: Lag by unit, primitive: bar_ranked, data: table/lag_by_unit, section: drivers }
      - { title: Past SLA, primitive: datagrid, data: table/late_datasets, section: exceptions }
      - { title: Backfills, primitive: gantt, data: spans/backfill, section: detail }
    drilldown: [performance, incident]
  pulse:
    events: [job.failed, sla.missed, freshness.breached]
    rate_limit: 30/min
  media:
    archetypes: [anchor]
  conversation:
    grounding: [kpis, series, events, tables]
    prompts:
      - "Which datasets are past their freshness SLA right now?"
      - "Did last night's backfill cause this morning's lag?"

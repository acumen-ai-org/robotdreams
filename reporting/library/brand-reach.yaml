version: v1alpha1
kind: ReportDefinition
name: brand-reach
description: What communications published, how far it carried, how it landed.
categories: [activity, quality]
modalities: [glance, narrative]
stances: [strategic, operational]

scope:
  attach: [site, realm]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      mentions: sum
      releases_published: sum
      share_of_voice_pct: avg
      sentiment_score: avg
      pickup_rate_pct: avg
    timeline: merge
    pulse: sample(20)

data:
  kpis:
    - { name: mentions, unit: count, window: 24h }
    - { name: share_of_voice_pct, unit: percent, window: 7d, direction: below }
    - { name: sentiment_score, unit: score, window: 7d, direction: below }  # 0-100
    - { name: releases_published, unit: count, window: 24h }
    - { name: pickup_rate_pct, unit: percent, window: 7d, target: 45, direction: below }
  series:
    - { name: mention_rate, unit: per-hour }
    - { name: sentiment_trend, unit: score }
  events:
    - { type: comms.release_published, severity: info }
    - { type: comms.coverage_spike, severity: info }
    - { type: comms.sentiment_drop, severity: warn }
    - { type: comms.negative_cycle, severity: critical }
  tables:
    - name: reach_by_channel
      columns: [channel, mentions, sentiment_score, pickup_rate_pct]
    - name: top_items
      columns: [item, channel, mentions, sentiment_score, picked_up]
    - name: mentions_by_unit
      columns: [unit, mentions]

facets:
  summary:
    status: { from: sentiment_score, warn_at: 55, critical_at: 40, direction: below }
    kpis: [mentions, share_of_voice_pct, sentiment_score, releases_published, pickup_rate_pct]
    sparkline: mention_rate
    headline: "{{mentions}} mentions at {{sentiment_score}} sentiment, {{pickup_rate_pct}}% pickup"
  timeline:
    events: [comms.release_published, comms.coverage_spike, comms.sentiment_drop, comms.negative_cycle]
    milestones: [comms.release_published]
  detail:
    panels:
      - { title: Mention rate, primitive: timeseries, data: series/mention_rate, section: overview }
      - { title: Sentiment against the week, primitive: timeseries, data: series/sentiment_trend, section: performance }
      - { title: Reach by outlet and channel, primitive: bar_ranked, data: table/reach_by_channel, section: drivers }
      - { title: Mentions by desk, primitive: bar_ranked, data: table/mentions_by_unit, section: drivers }
      - { title: Needs a response, primitive: ticker, data: events, section: exceptions }
      - { title: What we published, primitive: datagrid, data: table/top_items, section: detail }
    drilldown: [campaign, activity]
  pulse:
    events: [comms.coverage_spike, comms.negative_cycle]
    rate_limit: 10/min
  media:
    archetypes: [anchor, podcast]
  conversation:
    grounding: [kpis, series, tables]
    prompts:
      - "What is driving coverage today?"
      - "Which outlets picked up this week's release and which did not?"
      - "Has sentiment moved since the announcement?"

version: v1alpha1
kind: ReportDefinition
name: catalog
description: Content arriving, validated, and published — and what leaked on the way.
categories: [delivery, quality]
modalities: [glance, delta, narrative]
stances: [operational, diagnostic]

scope:
  attach: [site, realm, world]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      tracks_ingested: sum
      ingestion_failures: sum
      takedowns: sum
      catalog_size: sum
      metadata_completeness_pct: avg
      rights_coverage_pct: avg
    timeline: merge
    pulse: sample(20)

data:
  kpis:
    - { name: tracks_ingested, unit: count, window: 24h }
    - { name: ingestion_failures, unit: count, window: 24h }
    - { name: metadata_completeness_pct, unit: percent, target: 98, direction: below }
    - { name: takedowns, unit: count, window: 24h }
    - { name: rights_coverage_pct, unit: percent, target: 99.5, direction: below }
    - { name: catalog_size, unit: count }
  series:
    - { name: ingest_rate, unit: per-hour }
  events:
    - { type: delivery.received, severity: info }
    - { type: ingest.failed, severity: warn }
    - { type: takedown.received, severity: warn }
    - { type: rights.gap, severity: critical }
  tables:
    - name: ingest_stages
      columns: [stage, count]
    - name: tracks_by_source
      columns: [source, tracks]
    - name: recent_takedowns
      columns: [when, title, rights_holder, territory, reason]
    - name: tracks_by_unit
      columns: [unit, tracks_ingested]

facets:
  summary:
    status: { from: metadata_completeness_pct, warn_at: 96, critical_at: 90, direction: below }
    kpis: [tracks_ingested, ingestion_failures, metadata_completeness_pct, rights_coverage_pct]
    sparkline: ingest_rate
    headline: "{{tracks_ingested}} tracks in, {{ingestion_failures}} rejected, {{metadata_completeness_pct}}% metadata complete"
  timeline:
    events: [delivery.received, ingest.failed, takedown.received, rights.gap]
    milestones: [rights.gap]
  detail:
    panels:
      - { title: Ingest rate, primitive: timeseries, data: series/ingest_rate, section: overview }
      - { title: Delivered to published, primitive: funnel, data: table/ingest_stages, section: drivers }
      - { title: Volume by source, primitive: bar_ranked, data: table/tracks_by_source, section: drivers }
      - { title: Volume by unit, primitive: bar_ranked, data: table/tracks_by_unit, section: drivers }
      - { title: Takedowns and rights gaps, primitive: datagrid, data: table/recent_takedowns, section: exceptions }
    drilldown: [licensing, editorial]
  pulse:
    events: [ingest.failed, rights.gap]
    rate_limit: 20/min
  media:
    archetypes: [anchor, recap]
  conversation:
    grounding: [kpis, series, tables]
    prompts:
      - "Which aggregator is sending us the most unusable metadata?"
      - "How much of yesterday's delivery never reached listeners?"

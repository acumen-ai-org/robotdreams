version: v1alpha1
kind: ReportDefinition
name: cost
description: Tokens, compute, and spend consumed by the work.
categories: [cost]
modalities: [glance, delta]
stances: [operational, strategic]

scope:
  attach: [site, realm, world]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      tokens: sum
      compute_minutes: sum
      spend_usd: sum
      budget_used_pct: avg
    timeline: merge
    pulse: sample(20)
    time:
      kpis:
        tokens: sum
        compute_minutes: sum
        spend_usd: sum

data:
  kpis:
    - { name: tokens, unit: count, window: 24h }
    - { name: compute_minutes, unit: minutes, window: 24h }
    - { name: spend_usd, unit: count, window: 24h, direction: above }
    - { name: budget_used_pct, unit: percent, window: 24h, target: 100, direction: above }
  series:
    - { name: spend_rate, unit: per-hour }
  events:
    - { type: budget.threshold, severity: warn }
    - { type: budget.exceeded, severity: critical }
  tables:
    - name: top_spenders
      columns: [node, tokens, compute_minutes, spend_usd]
    - name: spend_bridge
      columns: [step, amount, kind]  # kind: total at the ends, delta between
    - name: spend_by_unit
      columns: [unit, spend_usd]

facets:
  summary:
    status: { from: budget_used_pct, warn_at: 80, critical_at: 100, direction: above }
    kpis: [spend_usd, budget_used_pct, tokens]
    sparkline: spend_rate
    headline: "{{spend_usd}} USD today, {{budget_used_pct}}% of budget"
  timeline:
    events: [budget.threshold, budget.exceeded]
    milestones: [budget.exceeded]
  detail:
    panels:
      - { title: Spend rate, primitive: timeseries, data: series/spend_rate, section: overview }
      - { title: Spend against budget, primitive: gauge, data: kpi/budget_used_pct, section: performance }
      - { title: What moved spend, primitive: waterfall, data: table/spend_bridge, section: drivers }
      - { title: Spend by unit, primitive: bar_ranked, data: table/spend_by_unit, section: drivers }
      - { title: Where it went, primitive: datagrid, data: table/top_spenders, section: detail }
    drilldown: [performance]
  pulse:
    events: [budget.exceeded]
    rate_limit: 10/min
  media:
    archetypes: [anchor]
  conversation:
    grounding: [kpis, series, tables]
    prompts:
      - "What is driving today's spend?"
      - "Which squads cost the most per shipped change?"

# Report template: cost — what the work consumed. Deliberately its own
# category rather than a corner of performance: it has a different owner
# (finance reads it, not the on-call), and every field sums when rolled
# up where performance percentiles do not. Copy, rename, and adapt.
#
# Register with:
#   dream server --reports reporting/library/

version: v1alpha1
kind: ReportDefinition
name: cost
description: Tokens, compute, and spend consumed by the work.
categories: [cost]
modalities: [glance, delta]
stances: [operational, strategic]

scope:
  attach: [site, realm, world]
  aggregation:
    status: worst
    headline: synthesize
    # Every one of these sums: cost is the rare case where naive
    # addition is exactly right at every level.
    kpis:
      tokens: sum
      compute_minutes: sum
      spend_usd: sum
      # The one field here that does not sum: budgets are per team, so
      # a group is over budget on average, not by addition.
      budget_used_pct: avg
    timeline: merge
    pulse: sample(20)
    # Over a period the counters sum the same way they do across scopes;
    # budget_used_pct stays latest — the newest reading is where the team
    # stands against its budget, not an average of where it stood.
    time:
      kpis:
        tokens: sum
        compute_minutes: sum
        spend_usd: sum

data:
  kpis:
    - { name: tokens, unit: count, window: 24h }
    - { name: compute_minutes, unit: minutes, window: 24h }
    # The budget is per team, so the instance carries the number and
    # the definition carries only which way is bad.
    - { name: spend_usd, unit: count, window: 24h, direction: above }
    # Spend against the team's OWN budget. This exists because an
    # absolute threshold cannot judge spend across teams of different
    # sizes: a 600-person care operation spending more than a 10-person
    # risk desk is not a finding, it is arithmetic. The ratio is what
    # travels, so it is what the status rule reads.
    - { name: budget_used_pct, unit: percent, window: 24h, target: 100, direction: above }
  series:
    - { name: spend_rate, unit: per-hour }
  events:
    - { type: budget.threshold, severity: warn }
    - { type: budget.exceeded, severity: critical }
  tables:
    - name: top_spenders
      columns: [node, tokens, compute_minutes, spend_usd]
    # The bridge from yesterday's spend to today's: a starting total,
    # the signed movements that explain it, and the closing total. kind
    # is `total` for the two ends and `delta` for everything between.
    - name: spend_bridge
      columns: [step, amount, kind]
    # One row per contributing unit, so a roll-up ranks the squads
    # beneath it without any extra aggregation rule.
    - name: spend_by_unit
      columns: [unit, spend_usd]

facets:
  summary:
    status: { from: budget_used_pct, warn_at: 80, critical_at: 100, direction: above }
    kpis: [spend_usd, budget_used_pct, tokens]
    sparkline: spend_rate
    headline: "{{spend_usd}} USD today, {{budget_used_pct}}% of budget"
  timeline:
    events: [budget.threshold, budget.exceeded]
    milestones: [budget.exceeded]
  detail:
    # Sections put the page in reading order: what happened, how it
    # compares, why it moved, what needs a decision, then the numbers.
    panels:
      - { title: Spend rate, primitive: timeseries, data: series/spend_rate, section: overview }
      - { title: Spend against budget, primitive: gauge, data: kpi/budget_used_pct, section: performance }
      - { title: What moved spend, primitive: waterfall, data: table/spend_bridge, section: drivers }
      - { title: Spend by unit, primitive: bar_ranked, data: table/spend_by_unit, section: drivers }
      - { title: Where it went, primitive: datagrid, data: table/top_spenders, section: detail }
    drilldown: [performance]
  pulse:
    events: [budget.exceeded]
    rate_limit: 10/min
  media:
    archetypes: [anchor]
  conversation:
    grounding: [kpis, series, tables]
    prompts:
      - "What is driving today's spend?"
      - "Which squads cost the most per shipped change?"

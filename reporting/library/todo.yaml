version: v1alpha1
kind: ReportDefinition
name: todo
description: A team's list — what is left, and what is done.
categories: [roadmap]
modalities: [board, glance]
stances: [operational]

scope:
  attach: [site]
  aggregation:
    status: worst
    headline: synthesize
    kpis:
      items_open: sum
      items_done: sum
    timeline: merge
    items: merge

data:
  kpis:
    - { name: items_open, unit: count }
    - { name: items_done, unit: count, window: 7d }
  events:
    - { type: item.added, severity: info }
    - { type: item.done, severity: info }

facets:
  summary:
    kpis: [items_open, items_done]
    headline: "{{items_done}} done, {{items_open}} left"
  plan:
    states: [committed, done]
    levels: [task]
  timeline:
    events: [item.added, item.done]
    milestones: [item.done]
  detail:
    panels:
      - { title: Open, primitive: kpi_card, data: kpi/items_open, section: overview }
      - { title: The list, primitive: checklist, data: items, section: next }
  pulse:
    events: [item.done]
    rate_limit: 10/min

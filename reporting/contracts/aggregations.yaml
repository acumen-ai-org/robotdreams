version: v1alpha1
kind: AggregationPolicies

scope_levels:
  - universe
  - world
  - realm
  - site

policies:
  - name: worst
    applies_to: [status]
    description: critical beats warn beats ok; absent instances ignored.
  - name: sum
    applies_to: [kpis]
  - name: avg
    applies_to: [kpis]
  - name: min
    applies_to: [kpis]
  - name: max
    applies_to: [kpis]
  - name: p50
    applies_to: [kpis]
  - name: p95
    applies_to: [kpis]
  - name: latest
    applies_to: [kpis, headline]
    description: the value from the most recently produced instance.
  - name: count
    applies_to: [kpis, items]
    description: >
      For kpis, the number of contributing instances, ignoring values.
      For items, the column totals with no cards at all — which is the
      honest universe-level board: four thousand cards is not a view,
      and "1,204 committed, 91 blocked" is.
  - name: merge
    applies_to: [timeline, pulse, series, items]
    description: >
      Chronological merge of all contributing streams, each item tagged
      with its origin scope.
  - name: sample
    applies_to: [pulse, timeline, items]
    parameter: n
    description: >
      Merge, then keep at most n items per window so a universe-level
      view doesn't drown; severity-weighted (failures survive sampling
      first). For a plan the window is a COLUMN: at most n cards per
      declared state, chosen by the keep-order below. The column counts
      stay exact either way — bounding the cards must never move a
      total, or a rolled-up board becomes a lie about how much work
      there is.
  - name: top
    applies_to: [headline, tables, items]
    parameter: n
    description: keep the n highest-ranked items (severity, recency).
  - name: synthesize
    applies_to: [headline]
    description: >
      Regenerate a summary over the child summaries (requires a model
      or template engine behind the deployment; MUST degrade to top(1)
      when none is available — degradation is explicit, never silent).

item_keep_order: [terminal_last, blocked_first, commitment, due, state, scope, id]

time:
  status: { applies: [worst, latest], default: worst }
  headline: { applies: [latest, top, synthesize], default: latest }
  kpis: { applies: [sum, avg, min, max, p50, p95, latest, count], default: latest }

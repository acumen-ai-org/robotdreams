# Continuous integration. `make ci` runs the same gates locally.
#
# Every action is pinned to a full commit SHA (the tag it corresponds to
# is in the trailing comment) so a moved tag cannot change what runs
# here; Dependabot keeps the pins current.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Nothing in this workflow writes to the repository.
permissions:
  contents: read

# One run per branch/PR at a time; a new push cancels the in-flight run of
# a pull request but never of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  # Build, vet, format check and race-detector unit tests. Mission Control
  # is built first so internal/dashboard's asset tests run against the real
  # bundle rather than the committed placeholder (which they skip on).
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # web/ must track exactly the placeholder page; dist/ is build output
      # and gitignored. If this fails a build was force-added.
      - name: Dashboard placeholder is intact (no build output committed)
        run: |
          tracked="$(git ls-files internal/dashboard/web)"
          if [ "$tracked" != "internal/dashboard/web/placeholder/index.html" ]; then
            echo "::error::internal/dashboard/web must track only placeholder/index.html, got:"
            echo "$tracked"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: internal/dashboard/ui/package-lock.json

      - name: Build Mission Control
        working-directory: internal/dashboard/ui
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test (race detector)
        run: go test -race ./...

      # Dashboard package tests must have seen the real bundle, not skipped.
      - name: Dashboard asset tests ran against the real build
        run: |
          out="$(go test -race -run 'TestStaticAssetsAreServedWithCorrectContentType' -v ./internal/dashboard/)"
          echo "$out"
          case "$out" in
            *"--- PASS: TestStaticAssetsAreServedWithCorrectContentType"*) ;;
            *) echo "::error::asset tests were skipped: the Mission Control build did not land in internal/dashboard/web"; exit 1 ;;
          esac

  # Commit subjects follow Conventional Commits (CONTRIBUTING.md); the
  # changelog and version bumps are derived from them by release-please.
  commits:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: commitlint (every commit in the pull request)
        run: |
          npx --yes -p @commitlint/cli@19.8.1 \
            commitlint --from "${{ github.event.pull_request.base.sha }}" \
                       --to "${{ github.event.pull_request.head.sha }}" --verbose

      # A squash merge takes the pull request title as the commit subject,
      # and release-please reads that subject, so the title must parse too.
      - name: commitlint (the pull request title)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --yes -p @commitlint/cli@19.8.1 commitlint --verbose

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Configuration lives in .golangci.yml (v2 schema). The linter version
      # is pinned; bump it together with the config.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false

  # Mission Control's own gates: eslint, prettier, tsc, the app build, and
  # the @robotdreams/mission-control library built the way `npm publish`
  # would and proven through a consumer that installs it via its exports
  # map, with no alias.
  dashboard-ui:
    name: Mission Control
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: internal/dashboard/ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: internal/dashboard/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build the app
        run: npm run build

      - name: Build the component library
        run: npm run build:lib

      - name: Smoke-test the built package
        run: npm run smoke

  # The release archive naming contract lives in .goreleaser.yaml and is
  # mirrored by two consumers: npm/scripts/install.js and
  # internal/selfupdate/release.go. The Go copy is pinned to the YAML by
  # TestGoreleaserContractUnchanged in `go test ./...`; this job is the
  # matching guard for the JS copy, run before a tag is cut.
  npm-launcher:
    name: npm launcher self-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installer self-test (archive naming contract)
        run: node npm/scripts/install.js --self-test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Integration tests
        run: go test -tags=integration ./test/...
